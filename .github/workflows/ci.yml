name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  examples:
    name: Check and render examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check every example
        run: for f in examples/*.cdl; do npm run --silent cdiag -- check "$f"; done
      - name: Render every example
        run: |
          mkdir -p build/ci
          for f in examples/*.cdl; do npm run --silent cdiag -- render "$f" -o "build/ci/$(basename "$f" .cdl).svg"; done
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-examples
          path: build/ci/*.svg

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose run --rm typescript
