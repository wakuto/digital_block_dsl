[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdiag-dsl"
version = "0.4.0"
description = "AI-friendly digital circuit block diagram DSL"
requires-python = ">=3.10"
dependencies = ["lark>=1.1", "graphviz>=0.20"]

[project.scripts]
cdiag = "cdiag.cli:main"

[tool.setuptools.package-data]
cdiag = ["grammar.lark"]
